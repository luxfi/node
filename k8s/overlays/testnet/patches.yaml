# Testnet: 5 nodes, sybil on, production-like resources
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: luxd
spec:
  replicas: 5
  template:
    spec:
      containers:
      - name: luxd
        image: ghcr.io/luxfi/node:test
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "8"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: do-block-storage-xfs
      resources:
        requests:
          storage: 200Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: luxd-config
data:
  LUXD_NETWORK_ID: "2"
