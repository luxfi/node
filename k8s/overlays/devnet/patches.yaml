# Devnet: 5 nodes, sybil off, moderate resources
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: luxd
spec:
  replicas: 5
  template:
    spec:
      containers:
      - name: luxd
        image: ghcr.io/luxfi/node:dev
        env:
        - name: LUXD_SYBIL_PROTECTION_ENABLED
          value: "false"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: do-block-storage
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: luxd-config
data:
  LUXD_NETWORK_ID: "3"
