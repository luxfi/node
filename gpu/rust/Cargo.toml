[package]
name = "lux-gpu"
version = "0.1.0"
edition = "2021"
description = "The one place a Lux chain asks for a primitive: a complete CPU backend, and an optional plugin that answers the same question faster."
license = "BSD-3-Clause-Eco"
repository = "https://github.com/luxfi/node-unified"
publish = false

[lib]
name = "lux_gpu"
path = "src/lib.rs"

[dependencies]
# The CPU backend. These are the same crates the chains named before this
# crate existed; moving them here is what makes one implementation of each
# primitive instead of one per chain.
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
hex = "0.4"
