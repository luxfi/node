# ARC Runner Scale Set: lux-build (amd64)
# Cluster: lux-k8s | Org: luxfi | Architecture: amd64
githubConfigUrl: "https://github.com/luxfi"
githubConfigSecret: lux-build-gha-rs-github-secret
runnerScaleSetName: lux-build
minRunners: 0
maxRunners: 10
template:
  spec:
    nodeSelector:
      doks.digitalocean.com/node-pool: lux-runners-amd64
    tolerations:
      - key: dedicated
        operator: Equal
        value: ci-runner
        effect: NoSchedule
    serviceAccountName: default
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command:
          - /bin/sh
          - -c
          - |
            for i in $(seq 1 60); do
              docker info >/dev/null 2>&1 && break
              echo "Waiting for Docker ($i)..."
              sleep 2
            done
            /home/runner/run.sh
        env:
          - name: DOCKER_HOST
            value: tcp://localhost:2375
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "8"
            memory: 28Gi
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/externals
      - name: dind
        image: docker:dind
        args: ["--host=tcp://0.0.0.0:2375"]
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "8"
            memory: 28Gi
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/externals
    volumes:
      - name: dind-externals
        emptyDir: {}
