# ARC Runner Scale Set values for luxfi org
# Docs: https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners-with-actions-runner-controller

# GitHub org-level runner
githubConfigUrl: "https://github.com/luxfi"

# Auth via GitHub App (secret created by setup.sh)
githubConfigSecret: arc-github-app

# Runner labels for workflow targeting
# Use: runs-on: [self-hosted, linux, amd64, lux-build]
runnerGroup: "default"

# Scaling: 1-6 runners based on demand
minRunners: 1
maxRunners: 6

# Runner pod template
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        env:
          - name: RUNNER_LABELS
            value: "self-hosted,linux,amd64,lux-build"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: go-cache
            mountPath: /home/runner/.cache/go-build
          - name: go-mod
            mountPath: /home/runner/go/pkg/mod
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 20Gi
      - name: go-cache
        emptyDir:
          sizeLimit: 5Gi
      - name: go-mod
        emptyDir:
          sizeLimit: 5Gi
    # Prefer scheduling on nodes with capacity
    tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300

# Controller connection
controllerServiceAccount:
  namespace: arc-system
  name: arc-gha-rs-controller
