name: Build Azure Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build'
        required: true
        type: string
      location:
        description: 'Azure location'
        required: false
        default: 'eastus'
        type: string
  push:
    tags:
      - "v*"

env:
  PACKER_VERSION: "1.11.2"

jobs:
  build-azure-image:
    name: Build Azure Managed Image
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Get Tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        run: packer init .github/packer/luxd-multicloud.pkr.hcl

      - name: Packer Validate
        run: |
          packer validate \
            -var "tag=${{ steps.get_tag.outputs.TAG }}" \
            -var "cloud=azure" \
            -var "azure_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var "azure_resource_group=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            .github/packer/luxd-multicloud.pkr.hcl

      - name: Build Azure Image
        run: |
          packer build \
            -var "tag=${{ steps.get_tag.outputs.TAG }}" \
            -var "cloud=azure" \
            -var "azure_subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var "azure_resource_group=${{ secrets.AZURE_RESOURCE_GROUP }}" \
            -var "azure_location=${{ inputs.location || 'eastus' }}" \
            -color=false \
            .github/packer/luxd-multicloud.pkr.hcl
        env:
          PACKER_LOG: 1
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Upload Manifest
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: azure-image-manifest
          path: packer-manifest.json

      - name: Output Image Details
        run: |
          echo "## Azure Image Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f packer-manifest.json ]; then
            IMAGE_NAME=$(cat packer-manifest.json | jq -r '.builds[0].artifact_id')
            echo "### Image: \`$IMAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Launch with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "az vm create \\" >> $GITHUB_STEP_SUMMARY
            echo "  --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \\" >> $GITHUB_STEP_SUMMARY
            echo "  --name luxd-node \\" >> $GITHUB_STEP_SUMMARY
            echo "  --image $IMAGE_NAME \\" >> $GITHUB_STEP_SUMMARY
            echo "  --size Standard_D4s_v3 \\" >> $GITHUB_STEP_SUMMARY
            echo "  --admin-username ubuntu \\" >> $GITHUB_STEP_SUMMARY
            echo "  --generate-ssh-keys" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  # Optionally publish to Azure Shared Image Gallery for easier distribution
  publish-to-gallery:
    name: Publish to Shared Image Gallery
    runs-on: ubuntu-22.04
    needs: build-azure-image
    if: github.event_name == 'push'  # Only on tag pushes

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Manifest
        uses: actions/download-artifact@v4
        with:
          name: azure-image-manifest

      - name: Get Tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish to Gallery
        run: |
          IMAGE_NAME=$(cat packer-manifest.json | jq -r '.builds[0].artifact_id' | cut -d'/' -f9)

          # Create image version in gallery
          az sig image-version create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --gallery-name luxdGallery \
            --gallery-image-definition luxd \
            --gallery-image-version "${{ steps.get_tag.outputs.TAG }}" \
            --managed-image "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.Compute/images/$IMAGE_NAME" \
            --target-regions "eastus" "westus2" "westeurope" \
            --replica-count 1
