name: Build AWS AMI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build'
        required: true
        type: string
      regions:
        description: 'AWS regions (comma-separated)'
        required: false
        default: 'us-east-1,us-west-2,eu-west-1'
        type: string
  push:
    tags:
      - "v*"

env:
  PACKER_VERSION: "1.11.2"

jobs:
  build-aws-ami:
    name: Build AWS AMI
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get Tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_AMI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        run: packer init .github/packer/luxd-multicloud.pkr.hcl

      - name: Packer Validate
        run: |
          packer validate \
            -var "tag=${{ steps.get_tag.outputs.TAG }}" \
            -var "cloud=aws" \
            .github/packer/luxd-multicloud.pkr.hcl

      - name: Build AMI
        run: |
          packer build \
            -var "tag=${{ steps.get_tag.outputs.TAG }}" \
            -var "cloud=aws" \
            -var "aws_region=us-east-1" \
            -color=false \
            .github/packer/luxd-multicloud.pkr.hcl
        env:
          PACKER_LOG: 1

      - name: Upload Manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-ami-manifest
          path: packer-manifest.json

      - name: Output AMI IDs
        run: |
          echo "## AWS AMI Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f packer-manifest.json ]; then
            echo "### AMI Details" >> $GITHUB_STEP_SUMMARY
            cat packer-manifest.json | jq -r '.builds[] | "- **\(.builder_type)**: `\(.artifact_id)`"' >> $GITHUB_STEP_SUMMARY
          fi
