name: Build GCP Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build'
        required: true
        type: string
      zone:
        description: 'GCP zone'
        required: false
        default: 'us-central1-a'
        type: string
  push:
    tags:
      - "v*"

env:
  PACKER_VERSION: "1.11.2"

jobs:
  build-gcp-image:
    name: Build GCP Compute Image
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Get Tag
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        run: packer init .github/packer/luxd-multicloud.pkr.hcl

      - name: Packer Validate
        run: |
          packer validate \
            -var "tag=${{ steps.get_tag.outputs.TAG }}" \
            -var "cloud=gcp" \
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            .github/packer/luxd-multicloud.pkr.hcl

      - name: Build GCP Image
        run: |
          packer build \
            -var "tag=${{ steps.get_tag.outputs.TAG }}" \
            -var "cloud=gcp" \
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "gcp_zone=${{ inputs.zone || 'us-central1-a' }}" \
            -color=false \
            .github/packer/luxd-multicloud.pkr.hcl
        env:
          PACKER_LOG: 1

      - name: Upload Manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcp-image-manifest
          path: packer-manifest.json

      - name: Make Image Public
        run: |
          IMAGE_NAME=$(cat packer-manifest.json | jq -r '.builds[0].artifact_id' | cut -d':' -f2)
          gcloud compute images add-iam-policy-binding "$IMAGE_NAME" \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --member='allAuthenticatedUsers' \
            --role='roles/compute.imageUser'
          echo "## GCP Image Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image: \`$IMAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Launch with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gcloud compute instances create luxd-node \\" >> $GITHUB_STEP_SUMMARY
          echo "  --image=$IMAGE_NAME \\" >> $GITHUB_STEP_SUMMARY
          echo "  --image-project=${{ secrets.GCP_PROJECT_ID }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --machine-type=n2-standard-4" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
