name: Docker

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-amd64:
    # Self-hosted `lux-build` ARC pool on DOKS hanzo-k8s (max 20 runners,
    # scales 0→N on demand). Org-isolated: luxfi workflows must use this
    # pool (never the hanzoai pools). amd64 only — DOKS has no arm64 yet.
    runs-on: lux-build
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/node
          # Semver-only policy: only `v*` git tags yield a published image
          # tag; every push gets an immutable `sha-<sha7>` for traceability.
          # No `:latest`, no `:main`, no floating tags ever.
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build & push (amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CGO_ENABLED=0
          # The Dockerfile resolves private luxfi/* modules via `git config
          # url.insteadOf` using this token. Default workflow GITHUB_TOKEN
          # only sees luxfi/node, so use the org-level GH_TOKEN (PAT) which
          # has read access to all luxfi/* repos (corona, etc.).
          secrets: |
            ghtok=${{ secrets.GH_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/luxfi/node:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/luxfi/node:buildcache-amd64,mode=max

  notify-universe:
    needs: build-amd64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.UNIVERSE_PAT }}
          repository: luxfi/universe
          event-type: image-published
          client-payload: |
            {
              "service": "node",
              "image": "ghcr.io/luxfi/node",
              "tag": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}"
            }
