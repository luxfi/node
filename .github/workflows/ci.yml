name: Tests

on:
  push:
    tags:
      - "*"
    branches:
      - main
      - dev
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Cancel ongoing workflow runs if a new one is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, ubuntu-24.04, windows-2022, custom-arm64-focal, custom-arm64-jammy]
        cgo: ['0', '1']
        exclude:
          # CGO tests on Windows are limited
          - os: windows-2022
            cgo: '1'
          # CGO tests require lux/accel C library (luxcpp/accel) which is only
          # installed on self-hosted runners. Skip CGO on GitHub-hosted runners.
          - os: macos-14
            cgo: '1'
          - os: ubuntu-22.04
            cgo: '1'
          - os: ubuntu-24.04
            cgo: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-focal-deps
        if: matrix.os == 'custom-arm64-focal'
      - uses: ./.github/actions/setup-go-for-project
      - name: Set timeout on Windows # Windows UT run slower and need a longer timeout
        shell: bash
        if: matrix.os == 'windows-2022'
        run: echo "TIMEOUT=240s" >> "$GITHUB_ENV"
      - name: Install C++ dependencies for CGO
        if: matrix.cgo == '1' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libczmq-dev libsodium-dev build-essential
      - name: Install C++ dependencies for CGO (macOS)
        if: matrix.cgo == '1' && runner.os == 'macOS'
        run: |
          brew install zeromq czmq libsodium || true
      - name: build_test
        shell: bash
        run: ./scripts/build_test.sh
        env:
          TIMEOUT: ${{ env.TIMEOUT }}
          CGO_ENABLED: ${{ matrix.cgo }}
  Fuzz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: fuzz_test
        shell: bash
        run: ./scripts/build_fuzz.sh 10 # Run each fuzz test 10 seconds
        env:
          CGO_ENABLED: '0'
  e2e_pre_etna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Build AvalancheGo Binary
        shell: bash
        run: ./scripts/build.sh
        env:
          CGO_ENABLED: '0'
      - name: Run e2e tests
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: E2E_SERIAL=1 ./scripts/tests.e2e.sh --delay-network-shutdown
          prometheus_id: ${{ secrets.PROMETHEUS_ID || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_id: ${{ secrets.LOKI_ID || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
      - name: Upload tmpnet network dir
        uses: ./.github/actions/upload-tmpnet-artifact
        if: always()
        with:
          name: e2e-pre-etna-tmpnet-data
  e2e_post_etna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Build AvalancheGo Binary
        shell: bash
        run: ./scripts/build.sh
        env:
          CGO_ENABLED: '0'
      - name: Run e2e tests
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: E2E_SERIAL=1 ./scripts/tests.e2e.sh --delay-network-shutdown --activate-etna
          prometheus_id: ${{ secrets.PROMETHEUS_ID || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_id: ${{ secrets.LOKI_ID || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
      - name: Upload tmpnet network dir
        uses: ./.github/actions/upload-tmpnet-artifact
        if: always()
        with:
          name: e2e-post-etna-tmpnet-data
  e2e_existing_network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Build AvalancheGo Binary
        shell: bash
        run: ./scripts/build.sh
        env:
          CGO_ENABLED: '0'
      - name: Run e2e tests with existing network
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: E2E_SERIAL=1 ./scripts/tests.e2e.existing.sh --delay-network-shutdown
          prometheus_id: ${{ secrets.PROMETHEUS_ID || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_id: ${{ secrets.LOKI_ID || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
      - name: Upload tmpnet network dir
        uses: ./.github/actions/upload-tmpnet-artifact
        if: always()
        with:
          name: e2e-existing-network-tmpnet-data
  Upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Build AvalancheGo Binary
        shell: bash
        run: ./scripts/build.sh
        env:
          CGO_ENABLED: '0'
      - name: Run e2e tests
        uses: ./.github/actions/run-monitored-tmpnet-cmd
        with:
          run: ./scripts/tests.upgrade.sh
          filter_by_owner: luxd-e2e
          prometheus_id: ${{ secrets.PROMETHEUS_ID || '' }}
          prometheus_password: ${{ secrets.PROMETHEUS_PASSWORD || '' }}
          loki_id: ${{ secrets.LOKI_ID || '' }}
          loki_password: ${{ secrets.LOKI_PASSWORD || '' }}
      - name: Upload tmpnet network dir
        uses: ./.github/actions/upload-tmpnet-artifact
        if: always()
        with:
          name: upgrade-tmpnet-data
  Lint:
    # Run on self-hosted runner - golangci-lint needs to compile packages
    # that depend on lux/accel CGO library
    runs-on: custom-arm64-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Run static analysis tests
        shell: bash
        run: scripts/lint.sh
      - name: Run shellcheck
        shell: bash
        run: scripts/shellcheck.sh
      - name: Run actionlint
        shell: bash
        run: scripts/actionlint.sh
  buf-lint:
    name: Protobuf Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1.47.2
        with:
          github_token: ${{ github.token }}
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: "proto"
  check_generated_protobuf:
    name: Up-to-date protobuf
    # Run on self-hosted runner - protoc-gen-go needs to compile packages
    runs-on: custom-arm64-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - uses: bufbuild/buf-setup-action@v1.47.2
        with:
          github_token: ${{ github.token }}
      - shell: bash
        run: scripts/protobuf_codegen.sh
      - shell: bash
        run: .github/workflows/check-clean-branch.sh
  check_mockgen:
    name: Up-to-date mocks
    # Run on self-hosted runner with accel library installed
    # mockgen reflect mode requires compiling packages with accel
    runs-on: custom-arm64-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - shell: bash
        run: scripts/mock.gen.sh
      - shell: bash
        run: .github/workflows/check-clean-branch.sh
  go_mod_tidy:
    name: Up-to-date go.mod and go.sum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - shell: bash
        run: go mod tidy
      - shell: bash
        run: .github/workflows/check-clean-branch.sh
  test_build_image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qemu (required for cross-platform builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
      - name: Check image build
        shell: bash
        run: bash -x scripts/tests.build_image.sh
        env:
          CGO_ENABLED: '0'
  test_build_antithesis_luxd_images:
    name: Build Antithesis luxd images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Build AvalancheGo Binary
        shell: bash
        run: ./scripts/build.sh
        env:
          CGO_ENABLED: '0'
      - name: Check that the luxd workload is sane
        shell: bash
        run: go run ./tests/antithesis/luxd --luxd-path=./build/luxd --duration=60s
        env:
          CGO_ENABLED: '0'
      - name: Check image build for luxd test setup
        shell: bash
        run: bash -x scripts/tests.build_antithesis_images.sh
        env:
          TEST_SETUP: luxd
          CGO_ENABLED: '0'
  test_build_antithesis_xsvm_images:
    name: Build Antithesis xsvm images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-for-project
      - name: Build AvalancheGo Binary
        shell: bash
        run: ./scripts/build.sh
        env:
          CGO_ENABLED: '0'
      - name: Build xsvm binary
        shell: bash
        run: ./scripts/build_xsvm.sh
        env:
          CGO_ENABLED: '0'
      - name: Check that the xsvm workload is sane
        shell: bash
        run: go run ./tests/antithesis/xsvm --luxd-path=./build/luxd --duration=60s
        env:
          CGO_ENABLED: '0'
      - name: Check image build for xsvm test setup
        shell: bash
        run: bash -x scripts/tests.build_antithesis_images.sh
        env:
          TEST_SETUP: xsvm
          CGO_ENABLED: '0'
