[package]
name = "lux-xvm"
version = "0.1.0"
edition = "2021"
description = "The Lux X-Chain in Rust: the UTXO DAG and asset transfers, ZAP on the wire."
license = "BSD-3-Clause-Eco"
repository = "https://github.com/luxfi/node2"
publish = false

[dependencies]
# Every primitive the chain is defined over — the three hashes, the RFC 6962
# fold, and public-key recovery — comes from here, and from nowhere else. A tx
# id is SHA-256 of its signed bytes; an address is RIPEMD-160 of the SHA-256 of
# a public key; every state-root leaf is Ethereum Keccak-256; a transfer is
# spendable because the sender is RECOVERED from the signature. This crate is
# also where the choice between computing those and handing them to an installed
# kernel library is made — see gpu/README.md.
lux-gpu = { path = "../../../gpu/rust" }

# Signing. A node never signs a transfer — a wallet does — so this is the test
# and tooling half of the same curve, and is deliberately not behind the
# primitive seam, which exists to make VERIFICATION agree across backends.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

# The one boundary where a chain answers a caller in a shape it did not
# choose. A hand-written parser at a boundary is a vulnerability with a
# schedule.
serde_json = "1"

[dev-dependencies]
# Golden vectors are hex, because that is how the Go generator prints them.
hex = "0.4"
