services:
  luxd:
    container_name: luxd
    image: ghcr.io/luxfi/node:latest
    restart: unless-stopped
    ports:
      - "9630:9630"
      - "9631:9631"
    volumes:
      - luxd-data:/root/.luxd
    environment:
      LUX_NETWORK_ID: "3"
      LUX_HTTP_HOST: "0.0.0.0"
      LUX_HTTP_PORT: "9630"
      LUX_STAKING_PORT: "9631"
      LUX_SYBIL_PROTECTION_ENABLED: "false"
      LUX_STAKING_ENABLED: "false"
      LUX_CONSENSUS_SAMPLE_SIZE: "1"
      LUX_CONSENSUS_QUORUM_SIZE: "1"
      LUX_LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9630/ext/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G

volumes:
  luxd-data:
