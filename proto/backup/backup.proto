syntax = "proto3";

package backup;

option go_package = "github.com/luxfi/node/proto/pb/backup";

// BackupService provides database backup and restore operations.
// Supports incremental backups via versioning.
service BackupService {
  // Backup streams the database backup to the client.
  // since: 0 for full backup, or version from last backup for incremental.
  // Returns chunks of zstd-compressed backup data.
  rpc Backup(BackupRequest) returns (stream BackupChunk);

  // Restore streams backup data from the client to restore the database.
  // The database should be empty or will be overwritten.
  rpc Restore(stream RestoreChunk) returns (RestoreResponse);

  // GetBackupMetadata returns information about the last backup.
  rpc GetBackupMetadata(GetBackupMetadataRequest) returns (BackupMetadata);
}

message BackupRequest {
  // Version to backup since (0 for full backup).
  uint64 since = 1;
  // Optional: compress output with zstd (default true).
  bool compress = 2;
}

message BackupChunk {
  // Chunk of backup data.
  bytes data = 1;
  // Sequence number for ordering.
  uint64 sequence = 2;
  // True if this is the last chunk.
  bool final = 3;
  // Version of this backup (for incremental tracking).
  // Only set on the final chunk.
  uint64 version = 4;
}

message RestoreChunk {
  // Chunk of backup data.
  bytes data = 1;
  // Sequence number for ordering.
  uint64 sequence = 2;
  // True if this is the last chunk.
  bool final = 3;
  // Whether data is zstd compressed.
  bool compressed = 4;
}

message RestoreResponse {
  // True if restore completed successfully.
  bool success = 1;
  // Error message if restore failed.
  string error = 2;
  // Number of keys restored.
  uint64 keys_restored = 3;
}

message GetBackupMetadataRequest {}

message BackupMetadata {
  // Version of the last backup.
  uint64 last_version = 1;
  // Unix timestamp of the last backup.
  int64 last_backup_time = 2;
  // Size in bytes of the last backup.
  uint64 last_backup_size = 3;
  // Whether the last backup was incremental.
  bool incremental = 4;
  // Path where metadata is stored.
  string metadata_path = 5;
}
